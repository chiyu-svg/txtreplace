# 构建 Windows / macOS 安装包并在打 tag 时创建 Release。
#
# 前提：仓库根目录就是本项目目录（package.json 所在目录）。
# 如果你的仓库根是上一级目录，请把本文件移到仓库根的 .github/workflows/，
# 并在 tauri-action 里加上 `projectPath: txtreplace`。
#
# 未签名时的表现：
# - Windows SmartScreen 提示“未知发布者”
# - macOS 首次打开需要右键 → 打开
# 需要正式签名时，按 Tauri 文档配置 APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY /
# APPLE_ID / APPLE_PASSWORD 等 secrets，以及 Windows 证书。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            platform: windows-latest
            args: ""
          - name: macos-universal
            platform: macos-latest
            args: "--target universal-apple-darwin"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust (Windows)
        if: matrix.platform == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust (macOS, universal)
        if: matrix.platform == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 只有 tag 构建才创建 Draft Release；手动触发时只构建并上传 artifacts。
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('TxtReplace {0}', github.ref_name) || '' }}
          releaseBody: |
            ## TxtReplace ${{ github.ref_name }}

            - Windows：下载 `.msi` 或 `*-setup.exe`（NSIS）
            - macOS：下载 `.dmg`（Universal，Intel + Apple Silicon 通用）
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TxtReplace-${{ matrix.name }}
          if-no-files-found: warn
          # 项目是 Cargo workspace，产物统一在仓库根的 target/ 下。
          path: |
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/dmg/*.dmg
